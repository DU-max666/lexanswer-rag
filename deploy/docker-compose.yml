# 法衡 · 律所内网私有化编排
# 原则：所有服务仅在内网可达；无公网出站依赖（镜像离线预载）。
# 用法见 deploy/README.md。

version: "3.8"

services:
  api:
    image: lexanswer-api:0.1.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      LEXANSWER_MILVUS_URI: http://milvus:19530
      LEXANSWER_MODEL_BASE_URL: http://vllm:8000/v1
      LEXANSWER_MODEL_NAME: lexanswer-7b
      LEXANSWER_FAQ_PATH: /app/corpus/faq.jsonl
      MYSQL_DSN: mysql://lex:${MYSQL_PASSWORD}@mysql:3306/lexanswer
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8080:8080"   # 仅绑定内网入口机回环，经所内网关反代暴露
    depends_on:
      - milvus
      - vllm
      - mysql
      - redis
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:latest        # 离线环境：所内 registry 预载
    command:
      - /models/lexanswer-merged
      - --served-model-name
      - lexanswer-7b
      - --max-model-len
      - "4096"
      - --gpu-memory-utilization
      - "0.85"
      - --max-num-seqs
      - "8"
    volumes:
      - ../finetune/output/lexanswer-merged:/models/lexanswer-merged:ro
    ports:
      - "8000:8000"              # 仅内网段可达，禁止出站
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:RELEASE.2024-05-01T16-30-30Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-lexanswer-internal}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-in-vault}
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --address 0.0.0.0:9000
    ports:
      - "9000:9000"

  milvus:
    image: milvusdb/milvus:v2.4.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
    depends_on:
      - etcd
      - minio

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须在 .env 中设置}
      MYSQL_DATABASE: lexanswer
      MYSQL_USER: lex
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?必须在 .env 中设置}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  mysql_data:
  redis_data:
